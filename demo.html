<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Dynamic Weather Card</title>
    <style>
        :root {
            --bg-top: #2E6FC7;
            --bg-bottom: #8CC2EC;
            --glass: rgba(250, 250, 252, 0.72);
            --glass-strong: rgba(255, 255, 255, 0.86);
            --glass-border: rgba(255, 255, 255, 0.55);
            --glass-shadow: 0 12px 40px rgba(0, 0, 0, 0.22);
            --text: #1c1c1e;
            --text-secondary: rgba(60, 60, 67, 0.7);
            --control: rgba(118, 118, 128, 0.14);
            --control-active: #ffffff;
            --accent: #0a84ff;
            --separator: rgba(60, 60, 67, 0.16);
            --radius-lg: 28px;
            --radius-md: 14px;
            --tabbar-h: 68px;
            --sheet-w: 400px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --glass: rgba(28, 28, 30, 0.66);
                --glass-strong: rgba(44, 44, 46, 0.88);
                --glass-border: rgba(255, 255, 255, 0.1);
                --glass-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
                --text: #f2f2f7;
                --text-secondary: rgba(235, 235, 245, 0.6);
                --control: rgba(118, 118, 128, 0.28);
                --control-active: rgba(99, 99, 102, 0.9);
                --separator: rgba(84, 84, 88, 0.55);
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: var(--text);
            background: #0b1020;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        /* ---------- Backdrop: follows the card's sky ---------- */
        #backdrop {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
            z-index: 0;
        }

        #backdrop::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(90% 70% at 50% 40%, rgba(255, 255, 255, 0.12), transparent 60%),
                radial-gradient(140% 100% at 50% 45%, transparent 40%, rgba(0, 0, 0, 0.45));
        }

        .glass {
            background: var(--glass);
            border: 0.5px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
        }

        /* ---------- Top bar ---------- */
        .topbar {
            position: fixed;
            top: max(14px, env(safe-area-inset-top));
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            z-index: 20;
            pointer-events: none;
        }

        .topbar > * { pointer-events: auto; }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px 8px 10px;
            border-radius: 999px;
            min-width: 0;
        }

        .brand-icon {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: linear-gradient(160deg, #4fa8ff, #1d5fd6);
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }

        .brand-text { min-width: 0; }

        .brand-title {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .top-actions {
            display: flex;
            gap: 8px;
            padding: 5px;
            border-radius: 999px;
            flex-shrink: 0;
        }

        .icon-btn {
            height: 36px;
            min-width: 36px;
            padding: 0 12px;
            border: none;
            border-radius: 999px;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }

        .icon-btn:hover { background: var(--control); }
        .icon-btn.active { background: var(--accent); color: #fff; }
        .icon-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

        /* ---------- Stage with the card ---------- */
        .stage {
            position: fixed;
            inset: 0;
            z-index: 1;
            overflow-y: auto;
            display: flex;
            padding: 84px 16px calc(var(--tabbar-h) + 40px + var(--safe-bottom) + var(--sheet-offset, 0px));
            transition: padding 0.35s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .stage-inner {
            margin: auto;
            width: min(480px, 100%);
        }

        #card-container {
            width: 100%;
            filter: drop-shadow(0 24px 48px rgba(0, 0, 0, 0.35));
        }

        .loading-message, .error-message {
            padding: 32px 20px;
            border-radius: var(--radius-lg);
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
            color: #fff;
            background: rgba(0, 0, 0, 0.35);
        }

        /* ---------- Floating tab bar ---------- */
        .tabbar {
            position: fixed;
            left: 50%;
            bottom: calc(18px + var(--safe-bottom));
            transform: translateX(-50%);
            display: flex;
            gap: 2px;
            padding: 6px;
            border-radius: 999px;
            z-index: 30;
            max-width: calc(100vw - 24px);
        }

        .tab {
            width: 76px;
            height: 56px;
            border: none;
            border-radius: 999px;
            background: transparent;
            color: var(--text-secondary);
            font: inherit;
            font-size: 10.5px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            transition: background 0.25s, color 0.25s;
        }

        .tab svg { width: 24px; height: 24px; }
        .tab:hover { color: var(--text); }
        .tab[aria-selected="true"] { background: var(--control); color: var(--accent); }

        .tab-label {
            max-width: 72px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ---------- Settings sheet ---------- */
        .sheet {
            position: fixed;
            left: 12px;
            right: 12px;
            bottom: calc(var(--tabbar-h) + 30px + var(--safe-bottom));
            max-height: min(52vh, 560px);
            border-radius: var(--radius-lg);
            z-index: 25;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(24px) scale(0.98);
            pointer-events: none;
            transition: opacity 0.3s, transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .sheet.open {
            opacity: 1;
            transform: none;
            pointer-events: auto;
        }

        .sheet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 16px 8px 20px;
        }

        .sheet-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .sheet-body {
            overflow-y: auto;
            padding: 4px 16px 20px;
            overscroll-behavior: contain;
        }

        .panel { display: none; }
        .panel.active { display: block; }

        @media (min-width: 1024px) {
            .sheet {
                left: auto;
                right: 20px;
                top: 84px;
                width: var(--sheet-w);
                max-height: none;
            }

            .stage.sheet-open {
                padding-right: calc(var(--sheet-w) + 36px);
            }

            .stage { padding-bottom: calc(var(--tabbar-h) + 40px); }
        }

        /* ---------- Controls ---------- */
        .group { margin-top: 18px; }
        .group:first-child { margin-top: 4px; }

        .group-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 0 4px 8px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
        }

        .group-title output {
            font-variant-numeric: tabular-nums;
            color: var(--text);
            font-weight: 600;
        }

        .card-list {
            background: var(--glass-strong);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 46px;
            padding: 8px 14px;
            font-size: 15px;
        }

        .row + .row { border-top: 0.5px solid var(--separator); }

        .chips {
            display: grid;
            grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
            gap: 8px;
        }

        .chip {
            border: none;
            border-radius: var(--radius-md);
            background: var(--glass-strong);
            color: var(--text);
            font: inherit;
            font-size: 11.5px;
            font-weight: 500;
            padding: 10px 4px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            min-width: 0;
            transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
        }

        .chip:active { transform: scale(0.96); }
        .chip .emoji { font-size: 24px; line-height: 1; }

        .chip .chip-label {
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chip[aria-pressed="true"] {
            box-shadow: inset 0 0 0 2px var(--accent);
            color: var(--accent);
        }

        .segmented {
            display: flex;
            padding: 2px;
            border-radius: 10px;
            background: var(--control);
        }

        .segmented button {
            flex: 1;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 13px;
            font-weight: 500;
            padding: 7px 6px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .segmented button[aria-pressed="true"] {
            background: var(--control-active);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.04);
            font-weight: 600;
        }

        .range-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--glass-strong);
            border-radius: var(--radius-md);
        }

        input[type="range"] {
            flex: 1;
            min-width: 0;
            -webkit-appearance: none;
            appearance: none;
            height: 28px;
            background: transparent;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(to right, var(--accent) var(--fill, 50%), var(--control) var(--fill, 50%));
        }

        input[type="range"]::-moz-range-track {
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(to right, var(--accent) var(--fill, 50%), var(--control) var(--fill, 50%));
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 26px;
            height: 26px;
            margin-top: -11px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25), 0 0 0 0.5px rgba(0, 0, 0, 0.06);
        }

        input[type="range"]::-moz-range-thumb {
            width: 26px;
            height: 26px;
            border: none;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        }

        input[type="range"].is-auto::-webkit-slider-runnable-track { background: var(--control); }
        input[type="range"].is-auto::-moz-range-track { background: var(--control); }

        .auto-btn {
            border: none;
            border-radius: 999px;
            padding: 5px 10px;
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            background: var(--control);
            color: var(--text);
            cursor: pointer;
            flex-shrink: 0;
        }

        .auto-btn[aria-pressed="true"] { background: var(--accent); color: #fff; }

        .text-input {
            width: 100%;
            border: none;
            outline: none;
            background: var(--glass-strong);
            color: var(--text);
            font: inherit;
            font-size: 15px;
            padding: 12px 14px;
            border-radius: var(--radius-md);
        }

        .text-input::placeholder { color: var(--text-secondary); }
        .text-input:focus { box-shadow: inset 0 0 0 2px var(--accent); }

        /* iOS-style switch */
        .switch {
            position: relative;
            width: 51px;
            height: 31px;
            flex-shrink: 0;
        }

        .switch input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            margin: 0;
        }

        .switch span {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            background: var(--control);
            transition: background 0.25s;
            pointer-events: none;
        }

        .switch span::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 27px;
            height: 27px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), 0 3px 1px rgba(0, 0, 0, 0.06);
            transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .switch input:checked + span { background: #34c759; }
        .switch input:checked + span::after { transform: translateX(20px); }
        .switch input:focus-visible + span { box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.5); }

        .swatches {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 10px 14px;
            background: var(--glass-strong);
            border-radius: var(--radius-md);
            align-items: center;
        }

        .swatch {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
            font-size: 11px;
            font-weight: 700;
            color: var(--text);
        }

        .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--glass-strong), 0 0 0 4px var(--accent); }

        .primary-btn {
            width: 100%;
            border: none;
            border-radius: var(--radius-md);
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-size: 15px;
            font-weight: 600;
            padding: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .primary-btn.secondary { background: var(--glass-strong); color: var(--accent); }

        .links a {
            color: var(--accent);
            text-decoration: none;
        }

        .footnote {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 8px 4px 0;
            line-height: 1.4;
        }

        @media (max-width: 480px) {
            .tab { width: 64px; }
            .tab-label { max-width: 60px; }
            .brand-subtitle { display: none; }
            .demo-label { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .sheet, .stage, .tab, .chip { transition: none; }
        }
    </style>
</head>
<body>
    <div id="backdrop"></div>

    <header class="topbar">
        <div class="brand glass">
            <div class="brand-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="3.2" fill="#FFD60A" stroke="#FFD60A"/><path d="M17.5 19H8a4 4 0 1 1 1.1-7.85A5 5 0 0 1 18.9 13a3 3 0 0 1-1.4 6z" fill="#fff"/></svg>
            </div>
            <div class="brand-text">
                <div class="brand-title" data-i18n="pageTitle">Dynamic Weather Card</div>
                <div class="brand-subtitle" data-i18n="pageSubtitle">Interactive Demo &amp; Configuration Tool</div>
            </div>
        </div>
        <div class="top-actions glass">
            <button class="icon-btn" id="tour-btn" type="button" title="Demo">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
                <span class="demo-label" data-i18n="startDemo">Start Demo Mode</span>
            </button>
            <a class="icon-btn" href="https://github.com/teuchezh/dynamic-weather-card" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.63-1.33-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.58 9.58 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></svg>
            </a>
        </div>
    </header>

    <main class="stage" id="stage">
        <div class="stage-inner">
            <div id="card-container">
                <div class="loading-message" data-i18n="loading">Loading card...</div>
            </div>
        </div>
    </main>

    <section class="sheet glass" id="sheet" aria-live="polite">
        <div class="sheet-header">
            <div class="sheet-title" id="sheet-title"></div>
            <button class="icon-btn" id="sheet-close" type="button" aria-label="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <div class="sheet-body" id="sheet-body"></div>
    </section>

    <nav class="tabbar glass" id="tabbar" role="tablist"></nav>

    <!-- Load the card bundle (Lit is bundled in) -->
    <script type="module">
        // Mock ha-card element
        if (!customElements.get('ha-card')) {
            customElements.define('ha-card', class extends HTMLElement {
                connectedCallback() {
                    this.style.display = 'block';
                    this.style.width = '100%';
                }
            });
        }

        try {
            const { i18n, resolveLanguage } = await import('./dynamic-weather-card.js');
            // The demo page's own strings are not in the card bundle: load them from the translation files
            const loaded = new Set();
            window.loadDemoStrings = async lang => {
                if (loaded.has(lang)) return;
                loaded.add(lang);
                try {
                    const response = await fetch(`src/internationalization/locales/${lang}/translation.json`);
                    const { demo } = await response.json();
                    if (demo) i18n.addTranslations(lang, { demo });
                } catch (err) {
                    console.warn(`Demo strings for "${lang}" not loaded`, err);
                }
            };
            const lang = resolveLanguage();
            await Promise.all([window.loadDemoStrings('en'), window.loadDemoStrings(lang)]);
            i18n.setLanguage(lang);
            window.i18n = i18n;
            window.cardLoaded = true;
            window.dispatchEvent(new CustomEvent('card-ready'));
        } catch (err) {
            console.error('Failed to load card:', err);
            const ru = (navigator.language || '').toLowerCase().startsWith('ru');
            document.getElementById('card-container').innerHTML = ru
                ? '<div class="error-message"><strong>⚠️ Не удалось загрузить карточку</strong><br>Проверьте консоль браузера (F12)<br><small>Откройте страницу через локальный сервер (не file://)</small></div>'
                : '<div class="error-message"><strong>⚠️ Failed to load card</strong><br>Check the browser console (F12) for details<br><small>Make sure the file is served via a local server (not file://)</small></div>';
        }
    </script>

    <!-- Demo application -->

        let activeTab = null;

        function renderTabbar() {
            const bar = document.getElementById('tabbar');
            bar.innerHTML = '';
            for (const [id, key, fallback] of TABS) {
                const button = document.createElement('button');
                button.className = 'tab';
                button.type = 'button';
                button.setAttribute('role', 'tab');
                button.setAttribute('aria-selected', String(activeTab === id));
                button.innerHTML = `${ICONS[id]}<span class="tab-label">${t(key, fallback)}</span>`;
                button.addEventListener('click', () => openTab(activeTab === id ? null : id));
                bar.appendChild(button);
            }
        }

        function openTab(id) {
            activeTab = id;
            const sheet = document.getElementById('sheet');
            sheet.classList.toggle('open', !!id);
            document.getElementById('stage').classList.toggle('sheet-open', !!id);
            if (id) {
                const tab = TABS.find(([tabId]) => tabId === id);
                document.getElementById('sheet-title').textContent = t(tab[1], tab[2]);
                renderPanel(id);
            }
            renderTabbar();
            updateSheetOffset();
        }

        // Keep the card centered in the space left above the bottom sheet
        function updateSheetOffset() {
            const sheet = document.getElementById('sheet');
            const docked = window.matchMedia('(min-width: 1024px)').matches;
            const offset = activeTab && !docked ? sheet.getBoundingClientRect().height + 12 : 0;
            document.documentElement.style.setProperty('--sheet-offset', `${offset}px`);
        }

        function el(tag, className, html) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (html !== undefined) node.innerHTML = html;
            return node;

        function groupWithTitle(label, output) {
            const group = el('div', 'group');

                if (output) title.append(output);
                group.append(title);
            }
            return group;
        }

        function renderPanel(id) {
            const body = document.getElementById('sheet-body');
            body.innerHTML = '';
            for (const control of PANELS[id]()) {
                body.append(renderControl(control));
            }
            syncControls();
        }

        function renderControl(c) {
            switch (c.type) {
                case 'chips': {
                    const group = groupWithTitle(c.label);
                    const grid = el('div', 'chips');
                    grid.style.setProperty('--cols', c.cols || 4);
                    for (const option of c.options) {
                        const chip = el('button', 'chip', `<span class="emoji">${option.emoji}</span><span class="chip-label">${option.label}</span>`);
                        chip.type = 'button';
                        chip.dataset.key = c.key;
                        chip.dataset.value = option.value;
                        chip.title = option.label;
                        chip.addEventListener('click', () => {
                            stopTimePlay();
                            stopTour();
                            setState({ [c.key]: option.value });
                        });
                        grid.append(chip);
                    }
                    group.append(grid);
                    return group;
                }
                case 'segmented': {
                    const group = groupWithTitle(c.label);
                    const seg = el('div', 'segmented');
                    for (const [value, label] of c.options) {
                        const button = el('button', '', label);
                        button.type = 'button';
                        button.dataset.key = c.key;
                        button.dataset.value = String(value);
                        button.addEventListener('click', () => {
                            setState({ [c.key]: value });
                            if (c.key === 'playSpeed' && timePlay) { stopTimePlay(); startTimePlay(); }
                        });
                        seg.append(button);
                    }
                    group.append(seg);
                    return group;
                }
                case 'range': {
                    const output = el('output');
                    output.dataset.out = c.key;
                    output._format = c.format || (v => String(v));
                    const group = groupWithTitle(c.label, output);
                    const wrap = el('div', 'range-wrap');
                    const input = el('input');
                    input.type = 'range';
                    input.min = c.min;
                    input.max = c.max;
                    input.step = c.step || 1;
                    input.dataset.range = c.key;
                    input.addEventListener('input', () => {
                        if (c.key === 'minutes') stopTimePlay();
                        c.onInput?.();
                        setState({ [c.key]: Number(input.value) }, { light: c.key === 'minutes' });
                    });
                    wrap.append(input);
                    if (c.nullable) {
                        const auto = el('button', 'auto-btn', t('autoShort', 'Auto'));
                        auto.type = 'button';
                        auto.dataset.autoFor = c.key;
                        auto.addEventListener('click', () => setState({ [c.key]: state[c.key] === null ? Number(input.value) : null }));
                        wrap.append(auto);
                    }
                    group.append(wrap);
                    return group;
                }
                case 'toggles': {
                    const group = groupWithTitle(c.label);
                    const list = el('div', 'card-list');
                    for (const [key, labelKey, fallback] of c.items) {
                        const row = el('label', 'row');
                        row.append(el('span', '', t(labelKey, fallback)));
                        const sw = el('span', 'switch', `<input type="checkbox" data-toggle="${key}"><span></span>`);
                        sw.querySelector('input').addEventListener('change', e => setState({ [key]: e.target.checked }));
                        row.append(sw);
                        list.append(row);
                    }
                    group.append(list);
                    return group;
                }
                case 'text': {
                    const group = groupWithTitle(c.label);
                    const input = el('input', 'text-input');
                    input.type = 'text';
                    input.placeholder = t(c.placeholder[0], c.placeholder[1]);
                    input.dataset.text = c.key;
                    input.addEventListener('input', () => setState({ [c.key]: input.value }));
                    group.append(input);
                    return group;
                }
                case 'swatches': {
                    const group = groupWithTitle(c.label);
                    const wrap = el('div', 'swatches');
                    for (const color of c.options) {
                        const swatch = el('button', 'swatch', color ? '' : 'A');
                        swatch.type = 'button';
                        swatch.dataset.key = c.key;
                        swatch.dataset.value = color;
                        swatch.title = color || t('autoShort', 'Auto');
                        swatch.style.background = color || 'conic-gradient(#ff453a, #ffd60a, #32d74b, #64d2ff, #bf5af2, #ff453a)';
                        swatch.addEventListener('click', () => setState({ [c.key]: color }));
                        wrap.append(swatch);
                    }
                    const input = el('input', 'text-input');
                    input.style.flex = '1';
                    input.style.minWidth = '120px';
                    input.style.padding = '8px 12px';
                    input.placeholder = 'rgb(…) / #hex / var(--…)';
                    input.dataset.text = c.key;
                    input.addEventListener('change', () => setState({ [c.key]: input.value.trim() }));
                    wrap.append(input);
                    group.append(wrap);
                    return group;
                }
                case 'presets': {
                    const group = groupWithTitle(c.label);
                    const grid = el('div', 'chips');
                    for (const [key, emoji, preset] of PRESETS) {
                        const chip = el('button', 'chip', `<span class="emoji">${emoji}</span><span class="chip-label">${t(key, key)}</span>`);
                        chip.type = 'button';
                        chip.addEventListener('click', () => { stopTour(); stopTimePlay(); setState(preset); });
                        grid.append(chip);
                    }
                    group.append(grid);
                    return group;
                }
                case 'play': {
                    const group = el('div', 'group');
                    const button = el('button', 'primary-btn secondary');
                    button.type = 'button';
                    button.id = 'time-play-btn';
                    button.addEventListener('click', () => (timePlay ? stopTimePlay() : startTimePlay()));
                    group.append(button);
                    return group;
                }
                case 'note': {
                    return el('p', 'footnote', t(c.text[0], c.text[1]));
                }
                case 'links': {
                    const group = groupWithTitle(['links', 'Links']);
                    const list = el('div', 'card-list links');
                    list.innerHTML = `
                        <a class="row" href="https://github.com/teuchezh/dynamic-weather-card" target="_blank" rel="noopener"><span>GitHub</span><span>↗</span></a>
                        <a class="row" href="https://github.com/teuchezh/dynamic-weather-card#configuration" target="_blank" rel="noopener"><span>${t('documentation', 'Documentation')}</span><span>↗</span></a>
                        <a class="row" href="https://github.com/teuchezh/dynamic-weather-card/issues" target="_blank" rel="noopener"><span>${t('reportIssue', 'Report an issue')}</span><span>↗</span></a>`;
                    group.append(list);
                    group.append(el('p', 'footnote', t('madeWith', 'Made with love for Home Assistant')));
                    return group;
                }
            }
            return el('div');
        }

        // Reflect state in the rendered controls
        function syncControls() {
            const body = document.getElementById('sheet-body');
            body.querySelectorAll('[data-key]').forEach(node => {
                node.setAttribute('aria-pressed', String(String(state[node.dataset.key]) === node.dataset.value));
            });
            body.querySelectorAll('[data-range]').forEach(input => {
                const key = input.dataset.range;
                const value = state[key];
                if (value !== null && document.activeElement !== input) input.value = value;
                const fill = ((Number(input.value) - Number(input.min)) / (Number(input.max) - Number(input.min))) * 100;
                input.style.setProperty('--fill', `${fill}%`);
                input.classList.toggle('is-auto', value === null);
            });
            body.querySelectorAll('[data-auto-for]').forEach(button => {
                button.setAttribute('aria-pressed', String(state[button.dataset.autoFor] === null));
            });
            body.querySelectorAll('output[data-out]').forEach(output => {
                const value = state[output.dataset.out];
                output.textContent = value === null ? t('autoShort', 'Auto') : output._format(value);
            });
            body.querySelectorAll('[data-toggle]').forEach(input => {
                input.checked = !!state[input.dataset.toggle];
            });
            body.querySelectorAll('[data-text]').forEach(input => {
                if (document.activeElement !== input) input.value = state[input.dataset.text] ?? '';
            });
            const playBtn = document.getElementById('time-play-btn');
            if (playBtn) playBtn.textContent = timePlay ? `⏸ ${t('pause', 'Pause')}` : `▶ ${t('play24h', 'Play 24 hours')}`;
            const tourBtn = document.getElementById('tour-btn');
            tourBtn.classList.toggle('active', !!tourTimer);
            tourBtn.querySelector('.demo-label').textContent = tourTimer ? t('stopDemo', 'Stop Demo') : t('startDemo', 'Start Demo Mode');
        }

        // ============================================================================
        // CARD
        // ============================================================================
        let card = null;
        let cardLayout = null;
        let forecastCache = { key: '', forecast: [] };

        function generateForecast(baseTemp, days, currentCondition) {
            const key = `${baseTemp}:${days}:${currentCondition}`;
            if (forecastCache.key === key) return forecastCache.forecast;

            // Hourly entries start on the hour, like Home Assistant's hourly forecasts
            const now = new Date();
            now.setMinutes(0, 0, 0);
            const forecast = [];
            const hours = Math.max(8, Math.floor(days) * 24);
            for (let i = 1; i <= hours; i++) {
                const time = new Date(now.getTime() + i * 3600 * 1000);
                const hour = time.getHours();
                // Warmer and cooler days, so the daily temperature bars differ
                const dayIndex = Math.floor((time - now) / 86400000);
                let temp = baseTemp + [0, 3, -2, 5, -4, 1, 6, -1][dayIndex % 8];
                if (hour >= 6 && hour < 12) temp += Math.floor(Math.random() * 3);
                else if (hour >= 12 && hour < 18) temp += 2 + Math.floor(Math.random() * 4);
                else if (hour >= 18 && hour < 22) temp += Math.floor(Math.random() * 3);
                else temp -= 2 + Math.floor(Math.random() * 3);

                // The next hours follow the current weather, so the rain start/stop line has something to show:
                // precipitation stops after 2 hours, or starts in 3 hours when it's dry now
                const nowWet = /rain|pouring|snow|hail|lightning/.test(currentCondition);
                let condition = FORECAST_CONDITIONS[Math.floor(Math.random() * FORECAST_CONDITIONS.length)];
                if (i <= 2) condition = currentCondition === 'clear-night' ? 'sunny' : currentCondition;
                else if (i <= 5) condition = nowWet ? 'partlycloudy' : baseTemp <= 0 ? 'snowy' : 'rainy';
                const wet = /rain|pouring|snow|hail|lightning/.test(condition);
                forecast.push({
                    datetime: time.toISOString(),
                    condition,
                    temperature: temp,
                    temp,
                    // The card shows the day's max chance in the daily forecast
                    precipitation_probability: wet ? Math.floor(Math.random() * (20 + (time.getDate() % 4) * 25)) : 0
                });
            }
            forecastCache = { key, forecast };
            return forecast;
        }

        function createMockHass() {
            const now = new Date();
            const sunrise = new Date(now);
            sunrise.setHours(6, 30, 0, 0);
            const sunset = new Date(now);
            sunset.setHours(18, 45, 0, 0);

            return {
                language: state.language,
                states: {
                    'weather.test': {
                        entity_id: 'weather.test',
                        state: state.condition,
                        attributes: {
                            condition: state.condition,
                            temperature: state.temperature,
                            humidity: state.humidity,
                            wind_speed: state.windSpeed,
                            wind_bearing: state.windBearing,
                            wind_gust_speed: Math.round(state.windSpeed * 1.5),
                            apparent_temperature: state.temperature - 3,
                            templow: state.temperature - 5,
                            pressure: 1013,
                            pressure_unit: 'hPa',
                            uv_index: /sunny|partlycloudy/.test(state.condition) ? 6 : 2,
                            // Rough dew point from temperature and humidity
                            dew_point: Math.round(state.temperature - (100 - state.humidity) / 5),
                            friendly_name: 'Demo Weather',
                            forecast: generateForecast(state.temperature, Math.max(state.dailyForecastDays, 2), state.condition),
                            sunrise: sunrise.toISOString(),
                            sunset: sunset.toISOString()
                        }
                    },
                    // Mock personal weather station (used when "Station sensors" is on).
                    // Wind speed in km/h and gust in m/s to show unit conversion.
                    'sensor.station_temperature': { state: '18.4', attributes: { unit_of_measurement: '°C' } },
                    'sensor.station_feels_like': { state: '16.9', attributes: { unit_of_measurement: '°C' } },
                    'sensor.station_humidity': { state: '72.4', attributes: { unit_of_measurement: '%' } },
                    'sensor.station_wind_speed': { state: '14.4', attributes: { unit_of_measurement: 'km/h' } },
                    'sensor.station_wind_gust': { state: '6', attributes: { unit_of_measurement: 'm/s' } },
                    'sensor.station_wind_bearing': { state: '200', attributes: { unit_of_measurement: '°' } },
                    'sensor.station_precipitation': { state: '1.25', attributes: { unit_of_measurement: 'mm' } },
                    'sensor.demo_aqi': { state: '42', attributes: { unit_of_measurement: 'AQI' } }
                }
            };
        }

        function buildCardConfig() {
            const config = {
                type: 'custom:dynamic-weather-card',
                entity: 'weather.test',
                height: state.height,
                overlay_opacity: state.overlayOpacity,
                text_shadow: state.textShadow,
                wind_speed_unit: state.windSpeedUnit,
                show_feels_like: state.showFeelsLike,
                show_min_temp: state.showMinTemp,
                show_humidity: state.showHumidity,
                show_wind: state.showWind,
                show_wind_direction: state.showWindDirection,
                show_wind_gust: state.showWindGust,
                show_sunrise_sunset: state.showSunriseSunset,
                show_pressure: state.showPressure,
                show_uv_index: state.showUvIndex,
                show_dew_point: state.showDewPoint,
                show_precipitation_outlook: state.showPrecipitationOutlook,
                show_temperature_bars: state.showTemperatureBars,
                show_aurora: state.showAurora,
                show_raindrops: state.showRaindrops,
                show_wind_effects: state.showWindEffects,
                show_clock: state.showClock,
                show_date: state.showDate,
                clock_position: state.clockPosition,
                clock_format: state.clockFormat,
                show_hourly_forecast: state.showHourlyForecast,
                hourly_forecast_hours: state.hourlyForecastHours,
                show_daily_forecast: state.showDailyForecast,
                daily_forecast_days: state.dailyForecastDays,
                language: state.language,
                layout: state.layout,
                visual_style: state.visualStyle,
                animation_quality: state.animationQuality,
                show_animations: state.showAnimations
            };
            if (state.name.trim()) config.name = state.name.trim();
            if (state.hourlyForecastTitle) config.hourly_forecast_title = state.hourlyForecastTitle;
            if (state.dailyForecastTitle) config.daily_forecast_title = state.dailyForecastTitle;
            if (state.showAqi) config.aqi_entity = 'sensor.demo_aqi';
            if (state.textColor) config.text_color = state.textColor;
            if (state.borderRadius !== null) config.border_radius = state.borderRadius;
            if (state.sunX !== null) config.sun_position_x = state.sunX;
            if (state.sunY !== null) config.sun_position_y = state.sunY;
            if (state.useSensors) {
                Object.assign(config, {
                    temperature_entity: 'sensor.station_temperature',
                    feels_like_entity: 'sensor.station_feels_like',
                    humidity_entity: 'sensor.station_humidity',
                    wind_speed_entity: 'sensor.station_wind_speed',
                    wind_gust_entity: 'sensor.station_wind_gust',
                    wind_bearing_entity: 'sensor.station_wind_bearing',
                    precipitation_entity: 'sensor.station_precipitation'
                });
            }
            return config;
        }

        function timeOfDayFromMinutes(minutes) {
            if (minutes >= 360 && minutes < 480) return { type: 'sunrise', progress: (minutes - 360) / 120 };
            if (minutes >= 480 && minutes < 1080) return { type: 'day', progress: (minutes - 480) / 600 };
            if (minutes >= 1080 && minutes < 1200) return { type: 'sunset', progress: (minutes - 1080) / 120 };
            return { type: 'night', progress: 0 };
        }

        function testTimeOfDay() {
            if (state.timeMode === 'auto') return null;
            if (state.timeMode === 'manual') return timeOfDayFromMinutes(state.minutes);
            return { type: state.timeMode, progress: state.timeMode === 'sunrise' || state.timeMode === 'sunset' ? 0.5 : 0.35 };
        }

        // Update the card in place (so the sky and clouds transition smoothly);
        // the card is only recreated when the layout changes
        function updateCard() {
            if (!window.cardLoaded) return;
            const container = document.getElementById('card-container');

            if (!card || cardLayout !== state.layout) {
                container.innerHTML = '';
                card = document.createElement('dynamic-weather-card');
                cardLayout = state.layout;
                card.setConfig(buildConfigSafe());
                applyTestOverrides();
                card.hass = createMockHass();
                container.appendChild(card);
                return;
            }

            card.setConfig(buildConfigSafe());
            applyTestOverrides();
            card.hass = createMockHass();
        }

        function buildConfigSafe() {
            const config = buildCardConfig();
            if (config.language) window.i18n?.setLanguage(config.language);
            return config;
        }

        function applyTestOverrides() {
            card._testTimeOfDay = testTimeOfDay();
            card._testMoonPhase = state.moonPhase === 'auto' ? null : Number(state.moonPhase);
            card.requestUpdate();
        }

        // Light update for continuous changes (time scrubbing / 24h playback)
        function updateTimeOnly() {
            if (!card) return;
            applyTestOverrides();
        }

        function setState(patch, { light = false } = {}) {
            const languageChanged = 'language' in patch && patch.language !== state.language;
            Object.assign(state, patch);
            if (patch.layout === 'minimal' && !('height' in patch)) state.height = 80;
            if (patch.layout === 'default' && !('height' in patch)) state.height = 200;

            if (light) {
                updateTimeOnly();
            } else {
                updateCard();
            }
            if (languageChanged) {
                window.i18n?.setLanguage(state.language);
                const refresh = () => {
                    applyStaticTranslations();
                    renderTabbar();
                    if (activeTab) openTab(activeTab);
                    syncControls();
                };
                refresh();
                // Re-render once this language's demo strings have loaded
                window.loadDemoStrings?.(state.language).then(refresh);
            }
            syncControls();
            requestAnimationFrame(updateSheetOffset);
        }

        // ============================================================================
        // DEMO TOUR & 24H PLAYBACK
        // ============================================================================
        let tourTimer = null;
        let tourStep = 0;
        let timePlay = null;

        function startTour() {
            stopTimePlay();
            tourStep = 0;
            const step = () => {
                setState(TOUR[tourStep]);
                tourStep = (tourStep + 1) % TOUR.length;
            };
            tourTimer = setInterval(step, 4000);
            step();
        }

        function stopTour() {
            if (!tourTimer) return;
            clearInterval(tourTimer);
            tourTimer = null;
            syncControls();
        }

        function startTimePlay() {
            stopTour();
            const duration = state.playSpeed * 1000;
            const startMinutes = state.timeMode === 'manual' ? state.minutes : 0;
            const startedAt = performance.now() - (startMinutes / 1440) * duration;
            state.timeMode = 'manual';
            const frame = now => {
                const progress = ((now - startedAt) % duration) / duration;
                state.minutes = Math.floor(progress * 1440);
                updateTimeOnly();
                syncControls();
                timePlay = requestAnimationFrame(frame);
            };
            timePlay = requestAnimationFrame(frame);
            syncControls();
        }

        function stopTimePlay() {
            if (!timePlay) return;
            cancelAnimationFrame(timePlay);
            timePlay = null;
            syncControls();
        }

        // ============================================================================
        // BACKDROP: mirror the card's current sky colors behind everything
        // ============================================================================
        function syncBackdrop() {
            const sky = card?.shadowRoot?.querySelector('.weather-card');
            if (!sky) return;
            const colors = getComputedStyle(sky).backgroundImage.match(/rgba?\([^)]+\)/g);
            if (!colors || colors.length < 2) return;
            const root = document.documentElement.style;
            root.setProperty('--bg-top', colors[0]);
            root.setProperty('--bg-bottom', colors[colors.length - 1]);
        }

        // ============================================================================
        // INIT
        // ============================================================================
        function init() {
            state.language = window.i18n.lang;
            applyStaticTranslations();
            renderTabbar();
            updateCard();
            syncControls();
            setInterval(syncBackdrop, 150);
            // Keep "Auto" time current
            setInterval(() => { if (card && state.timeMode === 'auto') card.requestUpdate(); }, 60_000);
        }

        document.getElementById('sheet-close').addEventListener('click', () => openTab(null));
        document.getElementById('tour-btn').addEventListener('click', () => (tourTimer ? stopTour() : startTour()));
        document.addEventListener('keydown', e => { if (e.key === 'Escape') openTab(null); });
        window.addEventListener('resize', updateSheetOffset);
        new ResizeObserver(updateSheetOffset).observe(document.getElementById('sheet'));

        if (window.cardLoaded) init();
        else window.addEventListener('card-ready', init, { once: true });
    </script>
</body>
</html>
