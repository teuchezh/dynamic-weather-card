name: Deploy demo to GitHub Pages

# Builds the card from main and publishes demo.html with a fresh bundle,
# so the live demo always shows the current main branch.
# Requires Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Show which build the demo runs, e.g. 2026.10.0-3-gabc1234
      - name: Set demo version
        run: |
          VERSION="$(git describe --tags --match 'v*' 2>/dev/null || echo "0.0.0-$(git rev-parse --short HEAD)")"
          VERSION="${VERSION#v}"
          echo "Demo version: $VERSION"
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Build
        run: bun run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp demo.html dynamic-weather-card.js _site/
          # Open the demo from the site root too
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=demo.html">
          <link rel="canonical" href="demo.html">
          <a href="demo.html">Dynamic Weather Card demo</a>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
